apiVersion: v1
kind: Pod
metadata:
  name: hpa-load-generator
  namespace: petclinic
  labels:
    app: hpa-load-generator
spec:
  restartPolicy: Never
  containers:
    - name: load-generator
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do
            i=0
            while [ "$i" -lt 10 ]; do
              wget -q -O /dev/null \
                http://spring-petclinic:8080/ &
              i=$((i + 1))
            done
            wait
          done
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi
