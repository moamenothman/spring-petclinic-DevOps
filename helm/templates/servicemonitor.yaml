apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spring-petclinic
  namespace: petclinic
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - petclinic
  selector: {}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
